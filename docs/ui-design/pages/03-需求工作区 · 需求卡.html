/span></button></div><div class="side-empty"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14l3 9v9H2v-9zM2 12h6l2 3h4l2-3h6M7 7h10"/></svg></span><span>暂无对话历史</span></div><div class="side-bottom"><button class="btn  " type="button"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 3 1-1h4l1 1 1 2 3 1 2 4-1 2 1 2-2 4-3 1-1 2-1 1h-4l-1-1-1-2-3-1-2-4 1-2-1-2 2-4 3-1z"/><circle cx="12" cy="12" r="3"/></svg></span><span>设置</span></button></div></aside><main class="content"><div class="inner"><header class="page-header"><div><h1>需求工作区</h1><p>把想法整理成讲得清、找得到依据、可以讨论的需求。</p></div><div class="actions"><button class="btn  " type="button"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span><span>新建项目</span></button></div></header><div class="actions" style="margin-bottom:20px"><div class="input with-icon"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V4h7l2 3h9v14H3zM3 10h18"/></svg></span><span class="">示例项目 · 产品需求</span></div><button class="btn primary " type="button"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span><span>新建需求</span></button></div><div class="requirements-grid"><aside class="requirements-list card"><div class="stack"><div class="input with-icon"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></span><span class="placeholder">搜索标题或需求编号</span></div><button class="btn  " type="button"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span><span>全部状态</span></button><button class="btn requirement-item primary" type="button"><span><strong>需求卡快速整理</strong><small>示例需求 · 草稿</small></span></button><button class="btn requirement-item" type="button"><span><strong>评审稿导出</strong><small>示例需求 · 草稿</small></span></button></div></aside><div class="stack"><section class="card"><div class="card-heading"><div><h2>需求卡快速整理</h2><div class="actions"><span class="tag ">草稿</span><span class="tag ">第 1 版 · 示例</span></div></div><div class="actions"><button class="btn  " type="button"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M3 16v5h18v-5"/></svg></span><span>导出评审稿</span></button><button class="btn primary " type="button"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg></span><span>保存修改</span></button></div></div><div class="tabs"><button class="btn primary " type="button"><span>需求卡</span></button><button class="btn  " type="button"><span>需求体检</span></button><button class="btn  " type="button"><span>版本历史</span></button><button class="btn  " type="button"><span>关联文档</span></button></div><p class="hint">填写已经知道的内容，不确定的部分放入待确认。</p><div class="form-grid"><div style="grid-column:1/-1"><label class="field"><span class="field-label">需求标题</span><div class="input "><span class="">示例需求 · 需求卡快速整理</span></div></label></div><div style=""><label class="field"><span class="field-label">目标用户</span><div class="textarea ">需要整理需求、编写 PRD 的产品经理。</div></label></div><div style=""><label class="field"><span class="field-label">使用场景</span><div class="textarea ">收集访谈记录后，在项目中整理为可讨论的需求卡。</div></label></div><div style=""><label class="field"><span class="field-label">用户问题</span><div class="textarea ">材料分散，内容与来源不容易对应，评审前需要反复补充。</div></label></div><div style="grid-column:1/-1"><label class="field"><span class="field-label">目标与价值</span><div class="textarea ">集中整理用户问题、范围与验收标准，保留待确认事项。</div></label></div><div style=""><label class="field"><span class="field-label">需求范围（做什么／不做什么）</span><div class="textarea ">支持手工编辑与 AI 整理需求卡；不自动把未核实的信息标记为已确认。</div></label></div><div style=""><label class="field"><span class="field-label">业务规则与流程</span><div class="textarea ">选择项目 → 输入材料 → 整理需求卡 → 保存 → 体检与人工确认。</div></label></div><div style=""><label class="field"><span class="field-label">异常与边界</span><div class="textarea ">模型不可用时仍可手工编辑；保存失败时保留当前输入。</div></label></div><div style="grid-column:1/-1"><label class="field"><span class="field-label">验收标准</span><div class="textarea ">保存后可以重新打开需求卡，并查看信息来源、待确认事项与版本记录。</div></label></div><div style=""><label class="field"><span class="field-label">优先级</span><div class="input "><span class="">待评审确认</span></div></label></div></div><section class="card"><div class="card-heading"><h3>信息来源</h3><div class="actions"><button class="btn  " type="button"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span><span>添加来源</span></button></div></div><div class="stack"><div class="input with-icon"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h5"/></svg></span><span class="">访谈记录（示例）</span></div><div class="textarea">用户希望先集中整理材料，再核对遗漏与验收标准。</div><div class="actions"><span class="tag ">文件资料</span><span class="tag ">目标用户</span><span class="tag ">用户问题</span><button class="btn  " type="button"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M9 6V3h6v3M6 6v15h12V6M10 10v7M14 10v7"/></svg></span><span>移除</span></button></div></div></section><section class="card"><div class="card-heading"><h3>待确认事项</h3><div class="actions"><button class="btn  " type="button"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span><span>添加待确认</span></button></div></div><div class="stack"><div class="input "><span class="">现有评审流程需要哪些参与者？</span></div><div class="textarea placeholder">填写确认结果与依据</div><div class="actions"><span class="tag ">1 项待确认</span><button class="btn  " type="button"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M9 6V3h6v3M6 6v15h12V6M10 10v7M14 10v7"/></svg></span><span>移除</span></button></div></div></section><div class="actions"><button class="btn  " type="button"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14l3 9v9H2v-9zM2 12h6l2 3h4l2-3h6M7 7h10"/></svg></span><span>归档</span></button><button class="btn  " type="button"><span class="icon-slot"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M9 6V3h6v3M6 6v15h12V6M10 10v7M14 10v7"/></svg></span><span>删除需求</span></button></div></section></div></div><div class="design-stamp">UI 设计稿 · 示例内容 · 待确认 · yuling</div></div></main></div></body></html>
